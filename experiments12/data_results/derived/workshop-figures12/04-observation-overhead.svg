<text x="312" y="735.812" font-size="23" font-weight="400" text-anchor="end" fill="#17324d">Turn clock</text>
<line x1="340" y1="727.812" x2="378" y2="727.812" stroke="#b8c2cc" stroke-width="7" stroke-linecap="round"/>
<text x="392" y="735.812" font-size="20" font-weight="400" text-anchor="start" fill="#536679">0</text>
<text x="1305" y="735.812" font-size="22" font-weight="400" text-anchor="middle" fill="#17324d">$0.00</text>
<text x="312" y="813.938" font-size="23" font-weight="400" text-anchor="end" fill="#17324d">Context use</text>
<line x1="340" y1="805.938" x2="378" y2="805.938" stroke="#b8c2cc" stroke-width="7" stroke-linecap="round"/>
<text x="392" y="813.938" font-size="20" font-weight="400" text-anchor="start" fill="#536679">0</text>
<text x="1305" y="813.938" font-size="22" font-weight="400" text-anchor="middle" fill="#17324d">$0.00</text>
