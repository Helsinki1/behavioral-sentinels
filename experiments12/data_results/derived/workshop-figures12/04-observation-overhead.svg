<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
<title>Observer token and recorded-cost overhead by monitoring method</title>
<style>text { font-family: 'Liberation Sans', Arial, sans-serif; }</style>
<rect x="0" y="0" width="1500" height="960" fill="#ffffff"/>
<text x="55" y="62" font-size="38" font-weight="700" text-anchor="start" fill="#17324d">Observation itself consumes compute</text>
<text x="55" y="104" font-size="25" font-weight="400" text-anchor="start" fill="#536679">Total observer tokens across 392 model–task cases; annotations show recorded observer cost</text>
<text x="55" y="142" font-size="21" font-weight="400" text-anchor="start" fill="#536679">Provider-backed methods each made 1,764 calls; deterministic rules, clock, and context-use made none</text>
<line x1="340" y1="205" x2="340" y2="850" stroke="#dbe3ea" stroke-width="2"/>
<text x="340" y="894" font-size="20" font-weight="400" text-anchor="middle" fill="#536679">0</text>
<line x1="592.778" y1="205" x2="592.778" y2="850" stroke="#dbe3ea" stroke-width="2"/>
<text x="592.778" y="894" font-size="20" font-weight="400" text-anchor="middle" fill="#536679">0.5M</text>
<line x1="845.556" y1="205" x2="845.556" y2="850" stroke="#dbe3ea" stroke-width="2"/>
<text x="845.556" y="894" font-size="20" font-weight="400" text-anchor="middle" fill="#536679">1.0M</text>
<line x1="1098.33" y1="205" x2="1098.33" y2="850" stroke="#dbe3ea" stroke-width="2"/>
<text x="1098.33" y="894" font-size="20" font-weight="400" text-anchor="middle" fill="#536679">1.5M</text>
<text x="795" y="935" font-size="23" font-weight="400" text-anchor="middle" fill="#17324d">total observer tokens</text>
<text x="1305" y="190" font-size="20" font-weight="600" text-anchor="middle" fill="#536679">recorded cost</text>
<rect x="45" y="220" width="1410" height="78.125" fill="#f7f9fb"/>
<text x="312" y="267.062" font-size="23" font-weight="600" text-anchor="end" fill="#17324d">Active recompute</text>
<rect x="340" y="242.062" width="701.431" height="34" fill="#d55e00" rx="4"/>
<text x="1029.43" y="267.062" font-size="20" font-weight="600" text-anchor="end" fill="#ffffff">1.39M</text>
<text x="1305" y="267.062" font-size="22" font-weight="600" text-anchor="middle" fill="#17324d">$1.43</text>
<text x="312" y="345.188" font-size="23" font-weight="400" text-anchor="end" fill="#17324d">Frozen recompute</text>
<rect x="340" y="320.188" width="672.004" height="34" fill="#0072b2" rx="4"/>
<text x="1000" y="345.188" font-size="20" font-weight="600" text-anchor="end" fill="#ffffff">1.33M</text>
<text x="1305" y="345.188" font-size="22" font-weight="600" text-anchor="middle" fill="#17324d">$1.43</text>
<rect x="45" y="376.25" width="1410" height="78.125" fill="#f7f9fb"/>
<text x="312" y="423.312" font-size="23" font-weight="400" text-anchor="end" fill="#17324d">Frozen current-copy</text>
<rect x="340" y="398.312" width="627.627" height="34" fill="#0072b2" rx="4"/>
<text x="955.627" y="423.312" font-size="20" font-weight="600" text-anchor="end" fill="#ffffff">1.24M</text>
<text x="1305" y="423.312" font-size="22" font-weight="600" text-anchor="middle" fill="#17324d">$1.14</text>
<text x="312" y="501.438" font-size="23" font-weight="400" text-anchor="end" fill="#17324d">Frozen quiz</text>
<rect x="340" y="476.438" width="815.582" height="34" fill="#0072b2" rx="4"/>
<text x="1143.58" y="501.438" font-size="20" font-weight="600" text-anchor="end" fill="#ffffff">1.61M</text>
<text x="1305" y="501.438" font-size="22" font-weight="600" text-anchor="middle" fill="#17324d">$2.21</text>
<rect x="45" y="532.5" width="1410" height="78.125" fill="#f7f9fb"/>
<text x="312" y="579.562" font-size="23" font-weight="400" text-anchor="end" fill="#17324d">Trace judge</text>
<rect x="340" y="554.562" width="894.122" height="34" fill="#0072b2" rx="4"/>
<text x="1222.12" y="579.562" font-size="20" font-weight="600" text-anchor="end" fill="#ffffff">1.77M</text>
<text x="1305" y="579.562" font-size="22" font-weight="600" text-anchor="middle" fill="#17324d">$12.36</text>
<text x="312" y="657.688" font-size="23" font-weight="400" text-anchor="end" fill="#17324d">Trace rules</text>
