<text x="296.875" y="723" font-size="22" font-weight="600" text-anchor="middle" fill="#17324d">Deterministic</text>
<text x="296.875" y="752" font-size="22" font-weight="600" text-anchor="middle" fill="#17324d">reconstruction</text>
