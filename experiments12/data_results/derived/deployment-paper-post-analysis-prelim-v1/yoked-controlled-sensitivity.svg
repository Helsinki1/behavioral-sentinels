<rect width="100%" height="100%" fill="#fff"/>
<text class="title" x="28" y="34">Yoked controlled sensitivity</text>
<text class="subtitle" x="28" y="55">Same 40 tasks; one active-anchored action at checkpoint 1 in every cell · isolates carry/operator sensitivity, not natural trigger timing</text>
